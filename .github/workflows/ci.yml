name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify G0 identity evidence
        if: matrix.python-version == '3.12'
        run: python scripts/verify_migration_evidence.py

      - name: Install project and development gates
        run: |
          python -m pip install 'pip>=26.1.2,<27'
          python -m pip install 'setuptools>=83,<84' 'wheel>=0.45,<1'
          python -m pip install -e '.[dev]'

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Strict typing
        run: python -m mypy src

      - name: Unit, negative, and coverage tests
        run: python -m pytest

      - name: Contract conformance
        run: |
          python -m transformation_portfolio_contracts.cli verify-conformance --json
          python -m transformation_portfolio_contracts.cli verify-example --json

      - name: Upload coverage from reference runtime
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and security gates
        run: |
          python -m pip install 'pip>=26.1.2,<27'
          python -m pip install 'setuptools>=83,<84' 'wheel>=0.45,<1'
          python -m pip install -e '.[dev]'

      - name: Scan Python source
        run: python -m bandit -q -r src setup.py

      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable --cache-dir "$RUNNER_TEMP/pip-audit-cache"

  distribution:
    name: Deterministic distribution
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "315532800"

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install 'pip>=26.1.2,<27'
          python -m pip install \
            'setuptools>=83,<84' 'wheel>=0.45,<1' 'build>=1.2,<2' 'twine>=6,<7'

      - name: Build twice
        run: |
          python -m build --outdir dist-a
          python -m build --outdir dist-b

      - name: Require deterministic archives
        run: |
          (cd dist-a && sha256sum * | sort -k2) > dist-a.sha256
          (cd dist-b && sha256sum * | sort -k2) > dist-b.sha256
          diff -u dist-a.sha256 dist-b.sha256

      - name: Validate package metadata
        run: python -m twine check dist-a/*

      - name: Smoke-test installed wheel and packaged resources
        run: |
          smoke_venv="$RUNNER_TEMP/tpc-wheel-smoke"
          smoke_cwd="$RUNNER_TEMP/tpc-wheel-smoke-cwd"
          catalog_json="$RUNNER_TEMP/tpc-wheel-catalog.json"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install 'pip>=26.1.2,<27'
          "$smoke_venv/bin/python" -m pip install dist-a/*.whl
          mkdir "$smoke_cwd"
          (
            unset TPC_CONTRACT_ROOT
            cd "$smoke_cwd"
            "$smoke_venv/bin/portfolio-contracts" --help
            "$smoke_venv/bin/portfolio-contracts" verify-events --help
            "$smoke_venv/bin/portfolio-contracts" catalog --json > "$catalog_json"
          )
          python - "$catalog_json" "$smoke_venv/share/transformation-portfolio-contracts" <<'PY'
          import json
          import sys
          from pathlib import Path

          actual = Path(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["root"])
          expected = Path(sys.argv[2])
          if actual.resolve(strict=True) != expected.resolve(strict=True):
              raise SystemExit(f"wheel resource root mismatch: {actual} != {expected}")
          PY
          (
            unset TPC_CONTRACT_ROOT
            cd "$smoke_cwd"
            "$smoke_venv/bin/portfolio-contracts" verify-conformance --json
            "$smoke_venv/bin/portfolio-contracts" verify-example --json
          )

      - name: Stage verified distributions
        run: |
          mkdir dist
          cp dist-a/* dist/
          (cd dist && sha256sum * | sort -k2 > SHA256SUMS)

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: transformation-portfolio-contracts-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
