name: Release

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Existing immutable release tag to recover"
        required: true
        type: choice
        options:
          - v1.0.0
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.target_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "315532800"

    steps:
      - name: Select release target
        id: target
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.target_tag }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$REQUESTED_TAG" = "v1.0.0"
            release_tag="$REQUESTED_TAG"
            release_commit="7362a85f381842d5178fc8b12bad48759fd46ec9"
            recovery_mode="true"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*.*.*) ;;
              *)
                echo "Release push must target a semantic-version tag." >&2
                exit 1
                ;;
            esac
            release_tag="$GITHUB_REF_NAME"
            release_commit="$GITHUB_SHA"
            recovery_mode="false"
          else
            echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          {
            echo "tag=$release_tag"
            echo "commit=$release_commit"
            echo "recovery_mode=$recovery_mode"
          } >> "$GITHUB_OUTPUT"

      - name: Check out exact release revision with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.commit }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify tag, source identity, version, and main ancestry
        shell: bash
        env:
          RELEASE_TARGET_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_TARGET_COMMIT: ${{ steps.target.outputs.commit }}
          RECOVERY_MODE: ${{ steps.target.outputs.recovery_mode }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET_COMMIT"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TARGET_TAG" = "v$version"
          git tag --points-at "$RELEASE_TARGET_COMMIT" | grep -Fx -- "$RELEASE_TARGET_TAG"

          if [ "$RECOVERY_MODE" = "true" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$RELEASE_TARGET_TAG" = "v1.0.0"
            test "$(git rev-parse "$RELEASE_TARGET_TAG^{tag}")" = \
              "75ab3f4c6ad171b7c2e6f3ad33512c774a44a126"
            test "$(git rev-parse "$RELEASE_TARGET_TAG^{commit}")" = \
              "7362a85f381842d5178fc8b12bad48759fd46ec9"
            test "$(git rev-parse "$RELEASE_TARGET_TAG^{tree}")" = \
              "194c5907711559ffeedc4fb11f104e92cabe132d"
          else
            test "$GITHUB_EVENT_NAME" = "push"
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TARGET_TAG"
            test "$GITHUB_SHA" = "$RELEASE_TARGET_COMMIT"
          fi

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_TARGET_COMMIT" origin/main
          {
            echo "RELEASE_TAG=$RELEASE_TARGET_TAG"
            echo "RELEASE_SOURCE_COMMIT=$RELEASE_TARGET_COMMIT"
            echo "RECOVERY_MODE=$RECOVERY_MODE"
          } >> "$GITHUB_ENV"
          if [ "$RECOVERY_MODE" = "true" ]; then
            {
              echo "RELEASE_TAG_OBJECT=75ab3f4c6ad171b7c2e6f3ad33512c774a44a126"
              echo "RELEASE_SOURCE_TREE=194c5907711559ffeedc4fb11f104e92cabe132d"
            } >> "$GITHUB_ENV"
          fi

      - name: Refuse release replacement
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacement is prohibited." >&2
            exit 1
          fi

      - name: Install project and release gates
        run: |
          python -m pip install 'pip>=26.1.2,<27'
          python -m pip install 'setuptools>=83,<84' 'wheel>=0.45,<1'
          python -m pip install -e '.[dev]'

      - name: Run complete quality gate
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m pytest
          python -m transformation_portfolio_contracts.cli verify-conformance --json
          python -m transformation_portfolio_contracts.cli verify-example --json
          python -m bandit -q -r src setup.py
          python -m pip_audit --local --skip-editable --cache-dir "$RUNNER_TEMP/pip-audit-cache"

      - name: Build twice and compare
        run: |
          python -m build --outdir dist-a
          python -m build --outdir dist-b
          (cd dist-a && sha256sum * | sort -k2) > dist-a.sha256
          (cd dist-b && sha256sum * | sort -k2) > dist-b.sha256
          diff -u dist-a.sha256 dist-b.sha256
          python -m twine check dist-a/*

      - name: Smoke-test wheel and resources
        run: |
          smoke_venv="$RUNNER_TEMP/tpc-release-smoke"
          smoke_cwd="$RUNNER_TEMP/tpc-release-smoke-cwd"
          catalog_json="$RUNNER_TEMP/tpc-release-catalog.json"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install 'pip>=26.1.2,<27'
          "$smoke_venv/bin/python" -m pip install dist-a/*.whl
          mkdir "$smoke_cwd"
          (
            unset TPC_CONTRACT_ROOT
            cd "$smoke_cwd"
            "$smoke_venv/bin/portfolio-contracts" verify-events --help
            "$smoke_venv/bin/portfolio-contracts" catalog --json > "$catalog_json"
          )
          python - "$catalog_json" "$smoke_venv/share/transformation-portfolio-contracts" <<'PY'
          import json
          import sys
          from pathlib import Path

          actual = Path(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["root"])
          expected = Path(sys.argv[2])
          if actual.resolve(strict=True) != expected.resolve(strict=True):
              raise SystemExit(f"wheel resource root mismatch: {actual} != {expected}")
          PY
          (
            unset TPC_CONTRACT_ROOT
            cd "$smoke_cwd"
            "$smoke_venv/bin/portfolio-contracts" verify-conformance --json
            "$smoke_venv/bin/portfolio-contracts" verify-example --json
          )

      - name: Stage release assets and checksums
        run: |
          mkdir dist
          cp dist-a/* dist/
          (cd dist && sha256sum *.whl *.tar.gz | sort -k2 > SHA256SUMS)

      - name: Attest GitHub Actions builder provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Create recovery source-material predicate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -Eeuo pipefail
          predicate="$RUNNER_TEMP/recovery-source-material.json"
          python - "$predicate" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          repository_uri = f"git+{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          predicate = {
              "name": "recover-v1.0.0-release",
              "command": [
                  "github-actions",
                  ".github/workflows/release.yml",
                  "workflow_dispatch",
                  "--target-tag",
                  os.environ["RELEASE_TAG"],
              ],
              "materials": [
                  {
                      "name": "annotated tag object refs/tags/v1.0.0",
                      "uri": f"{repository_uri}@refs/tags/{os.environ['RELEASE_TAG']}",
                      "digest": {"sha1": os.environ["RELEASE_TAG_OBJECT"]},
                  },
                  {
                      "name": "release source commit",
                      "uri": f"{repository_uri}@{os.environ['RELEASE_SOURCE_COMMIT']}",
                      "digest": {"sha1": os.environ["RELEASE_SOURCE_COMMIT"]},
                  },
                  {
                      "name": "release source tree",
                      "uri": (
                          f"{repository_uri}@{os.environ['RELEASE_SOURCE_COMMIT']}#tree"
                      ),
                      "digest": {"sha1": os.environ["RELEASE_SOURCE_TREE"]},
                  },
              ],
              "byproducts": {
                  "releaseTag": os.environ["RELEASE_TAG"],
                  "version": "1.0.0",
                  "verification": {
                      "annotatedTagObject": True,
                      "tagCommit": True,
                      "sourceTree": True,
                      "mainAncestor": True,
                      "deterministicBuild": True,
                      "qualitySecurityAndSmokeGates": True,
                  },
              },
              "environment": {
                  "runner": "github-hosted",
                  "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
                  "workflowCommit": os.environ["GITHUB_SHA"],
                  "workflowGitRef": os.environ["GITHUB_REF"],
                  "runId": os.environ["GITHUB_RUN_ID"],
                  "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
          }
          Path(sys.argv[1]).write_text(
              json.dumps(predicate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python -m json.tool "$predicate" >/dev/null
          sha256sum "$predicate"

      - name: Attest exact recovery source material
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          predicate-type: https://in-toto.io/attestation/link/v0.3
          predicate-path: ${{ runner.temp }}/recovery-source-material.json

      - name: Publish immutable GitHub release
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "Transformation Portfolio Contracts $RELEASE_TAG" \
            --generate-notes
