name: Ruff diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Exact Ruff 0.16.0 output
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Produce exact formatter and lint evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.16.0
          mkdir -p /tmp/ruff-diagnostic/src/transformation_portfolio_contracts /tmp/ruff-diagnostic/tests
          set +e
          python -m ruff check --fix . > /tmp/ruff-diagnostic/check-fix.txt 2>&1
          fix_rc=$?
          python -m ruff check . > /tmp/ruff-diagnostic/check-final.txt 2>&1
          check_rc=$?
          set -e
          python -m ruff format .
          cp src/transformation_portfolio_contracts/runtime_envelope.py \
            /tmp/ruff-diagnostic/src/transformation_portfolio_contracts/runtime_envelope.py
          cp tests/test_runtime_envelope.py /tmp/ruff-diagnostic/tests/test_runtime_envelope.py
          git diff -- . > /tmp/ruff-diagnostic/ruff.patch
          printf 'fix_rc=%s\ncheck_rc=%s\n' "$fix_rc" "$check_rc" \
            > /tmp/ruff-diagnostic/status.txt

      - name: Upload exact diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ruff-diagnostic-${{ github.sha }}
          path: /tmp/ruff-diagnostic/
          if-no-files-found: error
          retention-days: 1
