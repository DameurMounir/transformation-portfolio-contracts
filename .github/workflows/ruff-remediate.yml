name: Apply exact Ruff remediation

on:
  push:
    branches:
      - feat/02-runtime-envelope-v1-1

permissions:
  contents: write

jobs:
  remediate:
    name: Apply verified Ruff 0.16.0 output
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/02-runtime-envelope-v1-1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Apply and verify exact remediation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.16.0
          python -m ruff check --fix .
          python -m ruff format .
          rm -f .github/workflows/ruff-diagnostic.yml
          rm -f .github/workflows/ruff-remediate.yml
          python -m ruff check .
          python -m ruff format --check .
          git diff --check

          expected=$(printf '%s\n' \
            '.github/workflows/ruff-diagnostic.yml' \
            '.github/workflows/ruff-remediate.yml' \
            'src/transformation_portfolio_contracts/runtime_envelope.py' \
            'tests/test_runtime_envelope.py' | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: apply exact Ruff 0.16.0 output'
          git push origin HEAD:feat/02-runtime-envelope-v1-1
